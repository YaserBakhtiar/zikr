.ht{padding-inline-end:48px}

.rt{flex:1;display:flex;flex-direction:column;gap:2px}

.rg{width:44px;height:44px;display:grid;place-items:center;color:var(--acc)}
.ring{width:100%;height:100%;transform:rotate(-90deg)}

.tg{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;color:var(--mute);font-size:.88rem;text-decoration:none}

.rs:last-child{border:0}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

for(const l in X)Object.assign(translations[l],X[l]);
const IC={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',bed:'<path d="M3 18V6M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.5"/>',audio:'<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',gear:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',back:'<path d="M9 5l7 7-7 7"/>',play:'<path d="M8 5v14l11-7z" fill="currentColor"/>',pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',book:'<path d="M12 6c-2-1.5-5-2-8-1.5V18c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V4.5C17 4 14 4.5 12 6zM12 6v13.5"/>'};
const svg=(n)=>`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const ring=(p,r=20)=>{const c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 48 48"><circle class="rb" cx="24" cy="24" r="${r}"/><circle class="rf" cx="24" cy="24" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>`};
const CATS=[['morning','morningAdhkar','sun'],['evening','eveningAdhkar','moon'],['sleep','sleepAdhkar','bed'],['audio','audioAdhkar','audio']];
let currentLanguage='ar',data=null,view='home',cat='',items=[],counts=[],deferred;
const T=k=>translations[currentLanguage][k]||k;
const N=n=>(+n).toLocaleString(currentLanguage);
const fmt=s=>isNaN(s)?'00:00':String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
function dlg(title,msg,btns,extra=''){$('#mt').textContent=title;$('#mm').textContent=msg;$('#mx').innerHTML=extra;const a=$('#ma');a.innerHTML='';btns.forEach(([t,fn,p])=>{const b=document.createElement('button');b.textContent=t;b.className=p?'p':'';b.onclick=()=>{$('#modal').classList.remove('show');fn&&fn()};a.append(b)});$('#modal').classList.add('show')}
/* storage (same keys as before) */
const ck=c=>'adhkar_counts_'+c,tk=c=>'adhkar_timestamp_'+c;
function loadCounts(c,def){const s=localStorage.getItem(ck(c)),t=localStorage.getItem(tk(c)),now=Date.now();
if(t&&now-parseInt(t)>=RESET_INTERVAL){localStorage.setItem(tk(c),now);localStorage.setItem(ck(c),JSON.stringify(def));return[...def]}
if(s){try{const a=JSON.parse(s);if(Array.isArray(a)&&a.length===def.length)return a}catch(e){}}
if(!t)localStorage.setItem(tk(c),now);return[...def]}
const prog=k=>{if(!data||!data[k])return[0,0];const it=data[k];return[loadCounts(k,it.map(x=>x.repeat)).filter(x=>!x).length,it.length]};
/* sky */
function sky(){const d=new Date(),h=d.getHours()+d.getMinutes()/60;
const k=h>=4&&h<11?'morning':h>=11&&h<16?'day':h>=16&&h<19.5?'evening':'night';
const sun=h>=5&&h<19,t=sun?(h-5)/14:((h>=19?h-19:h+5)/10);
$('#hero').dataset.sky=k;$('#greet').textContent=T('greet'+k[0].toUpperCase()+k.slice(1));
const o=$('#orb');o.classList.toggle('moon',!sun);
requestAnimationFrame(()=>requestAnimationFrame(()=>{o.style.left=(14+72*t)+'%';o.style.top=(92-58*Math.sin(Math.PI*t))+'%'}))}
function home(){view='home';show('home');$('#appTitle').textContent=T('appName');
const h=new Date().getHours(),now=h>=4&&h<11?'morning':h>=15&&h<20?'evening':(h>=21||h<4)?'sleep':'';
$('#rows').innerHTML=CATS.map(([k,t,i])=>{const au=k==='audio',[a,b]=au?[0,0]:prog(k);
return `<button class="row" data-k="${k}"><span class="ic">${svg(i)}</span><span class="rt"><b>${T(t)}</b><small>${au||!b?'':N(a)+' / '+N(b)}</small></span>${k===now?`<em>${T('now')}</em>`:''}<span class="rg">${au?svg('play'):ring(b?a/b:0)}</span></button>`}).join('');
$$('.row').forEach(r=>{if(r.dataset.k===now)r.classList.add('now');r.onclick=()=>openCat(r.dataset.k,true)})}
function show(v){['home','list','audio'].forEach(x=>$('#'+x).classList.toggle('on',x===v));$('#bar').hidden=v==='home';scrollTo(0,0)}
const cb=i=>{const r=counts[i],n=items[i].repeat;return r?`<span class="cb"><svg class="ring" viewBox="0 0 48 48"><circle class="rb" cx="24" cy="24" r="21"/><circle class="rf" cx="24" cy="24" r="21" stroke-dasharray="${2*Math.PI*21}" stroke-dashoffset="${2*Math.PI*21*(r/n)}"/></svg><b>${N(r)}</b></span>`:`<span class="cb ok">${svg('check')}</span>`};
function upBar(){const d=counts.filter(x=>!x).length;$('#bc').textContent=N(d)+' / '+N(items.length);$('#bp').style.width=(d/items.length*100)+'%'}
function openCat(k,push){
if(k==='audio'){if(push)stopAll();view='audio';show('audio');$('#bt').textContent=T('audioAdhkar');$('#bc').textContent='';$('#bp').style.width=0;audioUI()}
else{if(!data||!data[k])return;cat=k;items=data[k];counts=loadCounts(k,items.map(x=>x.repeat));view='list';
$('#cards').innerHTML=items.map((it,i)=>{let text=it.text;
if(cat==='sleep'){text = text.replace('دستان خود را جمع کنید و در آن بدمید و این سوره ها را بخوانید:', translations[currentLanguage].sleepStep1); text = text.replace('بعدا دستان خود را مسح کنید بر جسد خویش تا آنجاییکه توان دارید از سر و صورت خویش آغاز نمایید.(این کار را سه مرتبه تکرار نمایید)', translations[currentLanguage].sleepStep2); text = text.replace('سوره {الم سجدةِ} و {مُلك} را بخوانید', translations[currentLanguage].sleepSurah);}
return `<article class="card${counts[i]?'':' done'}" data-i="${i}"><div class="tx">${text}</div><footer><span class="ref">${svg('book')}<span>${it.reference||T('source')}</span></span>${cb(i)}</footer></article>`}).join('');
show('list');$('#bt').textContent=T(k);upBar()}
if(push)history.pushState({k},'','#'+k)}
$('#cards').onclick=e=>{const c=e.target.closest('.card');if(!c||String(getSelection()))return;const i=+c.dataset.i;if(!counts[i])return;
counts[i]--;localStorage.setItem(ck(cat),JSON.stringify(counts));localStorage.setItem(tk(cat),Date.now());
navigator.vibrate&&navigator.vibrate(counts[i]?8:[12,40,12]);
c.querySelector('.cb').outerHTML=cb(i);c.querySelector('.cb').classList.add('pop');c.classList.toggle('done',!counts[i]);upBar();
if(!counts[i]){const nx=$$('.card').find((x,j)=>j>i&&!x.classList.contains('done'));
if(nx)setTimeout(()=>nx.scrollIntoView({behavior:'smooth',block:'center'}),350);
else if(counts.every(x=>!x))toast(T('allDone'))}};
/* audio */
const AU={};
function stopAll(){Object.values(AU).forEach(a=>{a.pause();a.currentTime=0})}
function audioUI(){if(!$('#acs').children.length){
$('#acs').innerHTML=['morning','evening'].map((k,n)=>`<div class="ac" data-k="${k}"><div class="at">${svg(n?'moon':'sun')}<span data-i18n="${k}Audio">${T(k+'Audio')}</span></div><div class="pr"><button class="pb" aria-label="play">${svg('play')}</button><div class="pa"><span class="tc">00:00</span><div class="bar2"><div><i></i></div></div><span class="td">00:00</span></div></div></div>`).join('');
$$('.ac').forEach((p,n)=>{const k=p.dataset.k,a=new Audio();a.preload='none';a.src=AUDIO_URLS[n];AU[k]=a;
const f=p.querySelector('i'),b=p.querySelector('.pb'),u=()=>{f.style.width=(a.duration?a.currentTime/a.duration*100:0)+'%';p.querySelector('.tc').textContent=fmt(a.currentTime);p.querySelector('.td').textContent=fmt(a.duration)};
a.onloadedmetadata=a.ontimeupdate=u;a.onplay=()=>b.innerHTML=svg('pause');a.onpause=a.onended=()=>b.innerHTML=svg('play');
b.onclick=()=>{if(a.paused){Object.values(AU).forEach(o=>o!==a&&o.pause());a.play().catch(()=>toast(T('downloadFailed')))}else a.pause()};
p.querySelector('.bar2').onclick=e=>{if(!a.duration)return;const r=e.currentTarget.getBoundingClientRect();let x=(e.clientX-r.left)/r.width;if(document.documentElement.dir==='rtl')x=1-x;a.currentTime=Math.min(1,Math.max(0,x))*a.duration}})}
$('#dl').innerHTML=svg('down')+`<span>${T('downloadAudio')}</span>`;$('#dl').hidden=localStorage.getItem('audioCached')==='true';
$$('.ac [data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n))}
$('#dl').onclick=()=>dlg(T('confirmDownloadTitle'),T('confirmDownloadMsg'),[[T('cancel')],[T('confirm'),download,1]]);
async function download(){let stop=false;dlg(T('downloadAudio'),`0 / ${AUDIO_URLS.length}`,[[T('cancel'),()=>stop=true]],'<div class="pbar"><i id="pf"></i></div>');
let n=0;try{const c=await caches.open('azkar-audio-v1');
for(const u of AUDIO_URLS){if(stop)break;try{const r=await fetch(u);if(r.ok){await c.put(u,r);n++;$('#pf').style.width=n/AUDIO_URLS.length*100+'%';$('#mm').textContent=`${n} / ${AUDIO_URLS.length}`}}catch(e){}}}catch(e){}
if(stop)return;$('#modal').classList.remove('show');
if(n===AUDIO_URLS.length){localStorage.setItem('audioCached','true');$('#dl').hidden=true;toast(T('downloadSuccess'))}else dlg(T('downloadFailed'),T('downloadFailed'),[[T('ok'),0,1]])}
/* language, theme, fonts */
function setLang(l){currentLanguage=l;localStorage.setItem('language',l);const d=document.documentElement;d.lang=l;d.dir=l==='en'?'ltr':'rtl';
$$('[data-i18n]').forEach(e=>e.textContent=T(e.dataset.i18n));$$('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
$$('[data-font]').forEach(b=>b.textContent=T('font'+b.dataset.font));
sky();if(view==='home')home();else openCat(view==='audio'?'audio':cat,false)}
function setTheme(d){document.body.classList.toggle('dark',d);$('#theme').setAttribute('aria-checked',d);$('#tcol').content=d?'#0a1220':'#eef3f2';localStorage.setItem('darkMode',d?'dark':'light')}
function setSize(s){s=Math.min(2.2,Math.max(1,s));document.documentElement.style.setProperty('--selected-font-size',s+'rem');$('#fv').textContent=N(s.toFixed(1));localStorage.setItem('fontSize',s.toFixed(1));return s}
function setFont(k){const s={Uthman:"'Uthman Taha','Lotus','Compset','Amiri',serif",Lotus:"'Lotus','Uthman Taha','Compset','Amiri',serif",Compset:"'Compset','Uthman Taha','Lotus','Amiri',serif"};
document.documentElement.style.setProperty('--selected-font',s[k]||s.Uthman);$$('[data-font]').forEach(b=>b.classList.toggle('on',b.dataset.font===k));localStorage.setItem('fontFamily',k)}
$('#gear').innerHTML=svg('gear');$('#back').innerHTML=svg('back');
$('#gear').onclick=()=>$('#sheet').classList.add('show');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.remove('show')};
$('#theme').onclick=()=>setTheme(!document.body.classList.contains('dark'));
let fs=parseFloat(localStorage.getItem('fontSize'))||1.5;
$('#fm').onclick=()=>fs=setSize(fs-.1);$('#fp').onclick=()=>fs=setSize(fs+.1);
$$('[data-font]').forEach(b=>b.onclick=()=>setFont(b.dataset.font));
$$('[data-lang]').forEach(b=>b.onclick=()=>{const first=!data;setLang(b.dataset.lang);$('#first').classList.remove('show');if(first&&!booted)boot()});
$('#back').onclick=()=>history.length>1?history.back():(stopAll(),home());
onpopstate=e=>{stopAll();const k=e.state&&e.state.k;k?openCat(k,false):home()};
/* install */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!localStorage.getItem('appInstalled')&&!matchMedia('(display-mode: standalone)').matches)$('#inst').hidden=false});
$('#ib').onclick=async()=>{if(!deferred)return;deferred.prompt();const{outcome}=await deferred.userChoice;if(outcome==='accepted'){localStorage.setItem('appInstalled','true');$('#inst').hidden=true}deferred=null};
addEventListener('appinstalled',()=>{localStorage.setItem('appInstalled','true');$('#inst').hidden=true});
/* boot */
let booted=false;
async function boot(){booted=true;
try{let r=await fetch(JSON_URL).catch(()=>null);if(!r||!r.ok)r=await fetch('azkar.json');data=await r.json()}
catch(e){dlg(T('errTitle'),T('errMsg'),[[T('ok'),0,1]])}
home();history.replaceState({},'',location.pathname)}
setTheme((localStorage.getItem('darkMode')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark');
fs=setSize(fs);setFont(localStorage.getItem('fontFamily')||'Uthman');
const sl=localStorage.getItem('language');
if(sl){setLang(sl);boot()}else{const b=navigator.language||'en',d=b.startsWith('fa')?'fa':b.startsWith('ar')?'ar':'en';
setLang(d);localStorage.removeItem('language');$('#ft').textContent=T('selectLanguage');$('#fp2').textContent=T('selectLanguageMsg');$('#first').classList.add('show')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
