<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأذكار</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="/zikr/icon.png">
<link rel="apple-touch-icon" href="/zikr/icon.png">
<meta name="theme-color" content="#0e4a4f" id="themeColor">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Uthman Taha';src:url('/zikr/fonts/UthmanTahaNaskhBold.ttf') format('truetype');font-weight:bold;font-display:swap}
@font-face{font-family:'Lotus';src:url('/zikr/fonts/lotus-Bold.ttf') format('truetype');font-weight:bold;font-display:swap}
@font-face{font-family:'Compset';src:url('/zikr/fonts/Compset-Bold.ttf') format('truetype');font-weight:bold;font-display:swap}

/* ===== Design tokens: parchment-stone + deep teal + gold leaf ===== */
:root{
--bg:#e9ede6;--bg-glow:rgba(14,74,79,.10);
--ink:#0d2f33;--ink-soft:#586f70;
--surface:rgba(250,251,247,.86);--surface-solid:#fafbf7;--sunken:#e2e8e1;
--line:rgba(13,47,51,.12);--line-strong:rgba(13,47,51,.22);
--accent:#0e5a5e;--accent-2:#14787a;--on-accent:#fff;
--gold:#b8923d;--gold-soft:rgba(184,146,61,.16);
--ok:#12795a;--ok-soft:rgba(18,121,90,.13);
--shadow:0 1px 2px rgba(13,47,51,.06),0 10px 28px -12px rgba(13,47,51,.22);
--shadow-lg:0 24px 60px -20px rgba(13,47,51,.35);
--r-lg:28px;--r-md:18px;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
--selected-font:'Uthman Taha','Lotus','Compset','Amiri',serif;--selected-font-size:1.5rem;
--ease:cubic-bezier(.22,.8,.3,1)}
body.dark{
--bg:#061a1c;--bg-glow:rgba(30,150,150,.14);
--ink:#eef1e6;--ink-soft:#93aeab;
--surface:rgba(14,40,43,.78);--surface-solid:#0e282b;--sunken:#0a2123;
--line:rgba(238,241,230,.10);--line-strong:rgba(238,241,230,.22);
--accent:#3fb7ad;--accent-2:#2a9d96;--on-accent:#04201f;
--gold:#d9b560;--gold-soft:rgba(217,181,96,.16);
--ok:#4cd3a0;--ok-soft:rgba(76,211,160,.14);
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
--shadow-lg:0 24px 60px -20px rgba(0,0,0,.8)}

/* ===== Base ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;
background:radial-gradient(90% 55% at 50% -10%,var(--bg-glow),transparent 70%),var(--bg);transition:background-color .3s,color .3s}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.7;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='none' stroke='%23b8923d' stroke-opacity='.16'><rect x='16' y='16' width='32' height='32'/><rect x='16' y='16' width='32' height='32' transform='rotate(45 32 32)'/></g></svg>");
-webkit-mask-image:linear-gradient(#000,transparent 60%);mask-image:linear-gradient(#000,transparent 60%)}
[dir="ltr"] body{font-family:'Segoe UI','Vazirmatn',sans-serif}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.app-container{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden}

/* ===== Settings ===== */
.settings-float{position:absolute;z-index:100;top:calc(var(--safe-top) + .75rem);inset-inline-end:1rem;width:44px;height:44px;
display:grid;place-items:center;font-size:1.1rem;color:var(--accent);cursor:pointer;padding:0;
background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);transition:transform .25s var(--ease)}
.settings-float i{transition:transform .5s var(--ease)}
.settings-float:hover i{transform:rotate(90deg)}
.settings-float:active{transform:scale(.94)}
.settings-panel{position:absolute;z-index:200;top:calc(var(--safe-top) + 4.2rem);inset-inline-end:1rem;width:min(320px,calc(100% - 2rem));
background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--r-lg);padding:.5rem 1.1rem;box-shadow:var(--shadow-lg);display:none}
.settings-panel.show{display:block;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
.setting-item{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.setting-item:last-child{border-bottom:0}
.setting-label{display:flex;align-items:center;gap:.65rem;font-size:.95rem;font-weight:500}
.setting-label i{width:1.5rem;text-align:center;color:var(--gold)}
.select-wrapper{position:relative;width:140px}
.custom-select{width:100%;height:40px;background-color:var(--sunken);border:1px solid var(--line);border-radius:12px;padding:0 2.2rem 0 .8rem;color:var(--ink);font-size:.88rem;cursor:pointer;appearance:none;-webkit-appearance:none;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23b8923d' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
background-repeat:no-repeat;background-position:left 10px center;padding-left:2.2rem;padding-right:.8rem}
[dir="ltr"] .custom-select{background-position:right 10px center;padding-right:2.2rem;padding-left:.8rem}
.inner-switch{width:50px;height:28px;padding:0;border:0;border-radius:30px;background:var(--line-strong);position:relative;cursor:pointer;transition:background .25s}
.inner-switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .25s var(--ease)}
.inner-switch.active{background:var(--accent)}
.inner-switch.active::after{left:calc(100% - 25px)}
.font-size-control{display:flex;align-items:center;gap:.35rem}
.font-size-btn{width:34px;height:34px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:11px;background:var(--sunken);font-size:1.15rem;cursor:pointer;transition:background .2s,transform .15s}
.font-size-btn:hover{background:var(--gold-soft)}
.font-size-btn:active{transform:scale(.9)}
.font-size-value{min-width:38px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.install-btn,.download-audio-btn,.modal-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);border:0;cursor:pointer}
.install-btn{border-radius:12px;padding:.5rem .95rem;font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:.4rem}
.hidden-btn{display:none!important}

/* ===== Home ===== */
.main-content{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.main-menu{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding:calc(var(--safe-top) + 4.5rem) max(1.25rem,calc((100% - 880px)/2)) 0}
.menu-center{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:1.5rem}
.main-menu .app-title{font-family:'Uthman Taha','Lotus','Amiri',serif;font-size:clamp(3rem,13vw,4.4rem);font-weight:bold;line-height:1.3;text-align:center;margin:0 0 2.2rem;
background:linear-gradient(180deg,var(--ink) 30%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.main-menu .app-title::after{content:"";display:block;width:84px;height:2px;margin:.4rem auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;width:100%;max-width:460px;margin:0 auto}
.menu-card{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1.6rem .8rem 1.3rem;text-align:center;cursor:pointer;
background:var(--surface);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.menu-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:var(--shadow-lg)}
.menu-card:active{transform:scale(.97)}
.menu-info h2{margin:0;font-size:1.05rem;font-weight:700;line-height:1.5}
/* mihrab-arch icon tiles: the one memorable shape */
.menu-icon{width:72px;height:84px;display:grid;place-items:center;font-size:1.7rem;color:#fff;border-radius:36px 36px 14px 14px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 10px 20px -8px rgba(13,47,51,.45)}
[data-category="morning"] .menu-icon{background:linear-gradient(160deg,#e3b44e,#c27a22)}
[data-category="evening"] .menu-icon{background:linear-gradient(160deg,#4a62b8,#27337a)}
[data-category="sleep"] .menu-icon{background:linear-gradient(160deg,#2a9a8e,#0e5a5e)}
[data-category="audio"] .menu-icon{background:linear-gradient(160deg,#a35a6a,#6a2f45)}
@media(min-width:760px){.menu-grid{max-width:880px;grid-template-columns:repeat(4,1fr);gap:1.25rem}.menu-card{padding:2rem 1rem 1.6rem}}

/* ===== Detail header ===== */
.detail-header{display:none;align-items:center;gap:.9rem;position:sticky;top:0;z-index:50;
padding:calc(var(--safe-top) + .75rem) 4.5rem .75rem max(1rem,calc((100% - 720px)/2 + 1rem));
background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
[dir="ltr"] .detail-header{padding:calc(var(--safe-top) + .75rem) max(1rem,calc((100% - 720px)/2 + 1rem)) .75rem 4.5rem}
.detail-header.active{display:flex;animation:pop .3s var(--ease)}
.detail-header .back-btn{width:44px;height:44px;display:grid;place-items:center;padding:0;font-size:1rem;color:var(--accent);cursor:pointer;background:var(--sunken);border:1px solid var(--line);border-radius:14px;transition:transform .2s}
[dir="ltr"] .back-btn i{transform:scaleX(-1)}
.detail-header .back-btn:active{transform:scale(.92)}
.detail-header .page-title{flex:1;margin:0;font-size:1.2rem;font-weight:700}
.detail-view{min-height:0;flex:1}

/* ===== Dhikr cards: manuscript page with inner gold frame ===== */
.dhikr-list{flex:1;overflow-y:auto;padding:1rem max(1rem,calc((100% - 720px)/2)) calc(2rem + var(--safe-bot));counter-reset:d;scrollbar-width:thin}
.dhikr-card{position:relative;counter-increment:d;margin-bottom:1rem;padding:2.6rem 1.25rem 1.2rem;background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.dhikr-card::after{content:"";position:absolute;inset:7px;border:1px solid var(--gold-soft);border-radius:21px;pointer-events:none}
.dhikr-card::before{content:counter(d);position:absolute;top:0;inset-inline-start:50%;transform:translate(-50%,-50%);min-width:34px;height:34px;padding:0 .5rem;display:grid;place-items:center;
font-size:.85rem;font-weight:700;color:var(--gold);background:var(--surface-solid);border:1px solid var(--gold);border-radius:12px;font-variant-numeric:tabular-nums}
.dhikr-text{font-family:var(--selected-font);font-weight:bold;font-size:var(--selected-font-size);line-height:2;text-align:center;margin-bottom:1.2rem}
.dhikr-meta{display:flex;flex-direction:column;align-items:center;gap:.8rem;border-top:1px dashed var(--line-strong);padding-top:1rem}
.reference{display:inline-flex;align-items:center;gap:.4rem;max-width:100%;padding:.25rem .8rem;font-size:.72rem;line-height:1.7;color:var(--ink-soft);background:var(--sunken);border-radius:30px;direction:ltr;text-align:center}
[dir="rtl"] .reference{direction:rtl}
.repeat-badge,.completed-badge{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;width:100%;max-width:340px;min-height:52px;padding:.5rem 1.5rem;border:0;border-radius:16px;font-size:1rem;font-weight:700;user-select:none;-webkit-user-select:none}
.repeat-badge{cursor:pointer;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 8px 18px -8px var(--accent);transition:transform .15s var(--ease),filter .2s}
.repeat-badge:hover{filter:brightness(1.08)}
.repeat-badge:active{transform:scale(.96)}
.completed-badge{color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok);pointer-events:none;transition:transform .2s}

/* ===== Audio ===== */
.audio-detail{flex:1;overflow-y:auto;padding:1rem max(1rem,calc((100% - 720px)/2)) calc(2rem + var(--safe-bot))}
.audio-card{margin-bottom:1rem;padding:1.2rem;background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.audio-title{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;font-size:1.1rem;font-weight:700}
.audio-title i{color:var(--gold)}
.custom-audio-player{display:flex;align-items:center;gap:.9rem;direction:ltr;padding:.5rem .9rem .5rem .5rem;background:var(--sunken);border-radius:40px}
.play-btn{flex-shrink:0;width:44px;height:44px;display:grid;place-items:center;padding:0;border:0;border-radius:50%;font-size:1rem;color:var(--on-accent);cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 14px -6px var(--accent);transition:transform .15s}
.play-btn:active{transform:scale(.92)}
.progress-area{flex:1;display:flex;align-items:center;gap:.6rem;min-width:0}
.time{min-width:42px;text-align:center;font-size:.78rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.progress-bar{flex:1;height:6px;border-radius:10px;background:var(--line-strong);cursor:pointer;position:relative}
.progress-bar::after{content:"";position:absolute;inset:-12px 0}
.progress-fill{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--gold))}
audio{display:none}
.download-audio-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:.6rem;min-height:50px;padding:.6rem 1rem;border-radius:16px;font-size:.92rem;font-weight:600;line-height:1.6;transition:transform .15s}
.download-audio-btn:active{transform:scale(.97)}

/* ===== Footer ===== */
.footer{flex-shrink:0;text-align:center;padding:.9rem 1rem calc(.9rem + var(--safe-bot))}
.footer.hidden{display:none}
.telegram-link{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem 1rem;font-size:.85rem;font-weight:500;color:var(--ink-soft);text-decoration:none;border:1px solid var(--line);border-radius:30px;transition:color .2s,border-color .2s}
.telegram-link:hover{color:var(--accent);border-color:var(--accent)}
.telegram-svg{width:20px;height:20px;fill:currentColor}

/* ===== Modals (bottom sheet on mobile) ===== */
.modal-overlay{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(3,18,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{width:90%;max-width:400px;padding:2rem 1.5rem 1.5rem;text-align:center;background:var(--surface-solid);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);animation:up .3s var(--ease)}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.modal-icon{width:60px;height:68px;margin:0 auto 1rem;display:grid;place-items:center;font-size:1.5rem;color:var(--gold);background:var(--gold-soft);border-radius:30px 30px 12px 12px}
.modal-title{font-size:1.2rem;font-weight:700;margin-bottom:.4rem}
.modal-message{font-size:.92rem;line-height:1.9;color:var(--ink-soft)}
.modal-actions{display:flex;justify-content:center;gap:.7rem;margin-top:1.4rem}
.modal-btn{flex:1;max-width:170px;min-height:46px;padding:.6rem 1.2rem;border:1px solid var(--line);border-radius:14px;font-size:.95rem;font-weight:600;cursor:pointer;background:var(--sunken);color:var(--ink);transition:transform .15s}
.modal-btn:active{transform:scale(.95)}
.modal-btn.primary{border:0}
.lang-buttons{display:flex;flex-direction:column;gap:.7rem;margin:1.4rem 0 .4rem}
.lang-btn{display:flex;align-items:center;justify-content:center;gap:.8rem;min-height:52px;padding:.6rem;font-size:1.1rem;font-weight:600;cursor:pointer;background:var(--sunken);border:1px solid var(--line);border-radius:16px;transition:border-color .2s,background .2s,transform .15s}
.lang-btn:hover{border-color:var(--gold);background:var(--gold-soft)}
.lang-btn:active{transform:scale(.97)}
.lang-btn i{color:var(--gold)}
.progress-modal .modal-card{max-width:350px}
.progress-bar-container{height:8px;margin:1rem 0;border-radius:10px;overflow:hidden;background:var(--line-strong)}
.progress-fill-bar{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .2s}
.progress-percent{margin:.4rem 0;font-size:1.3rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.download-progress-text{font-size:.88rem;color:var(--ink-soft)}
@media(max-width:520px){
.modal-overlay{align-items:flex-end}
.modal-card{width:100%;max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;padding-bottom:calc(1.5rem + var(--safe-bot))}
.progress-modal .modal-card{max-width:none}}

/* ===== Loading ===== */
.loading-spinner{display:inline-block;width:40px;height:40px;border:3px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app-container" id="appContainer">
<button type="button" class="settings-float" id="settingsIcon" aria-label="Settings"><i class="fas fa-cog"></i></button>
<div class="settings-panel" id="settingsPanel">
<div class="setting-item">
<span class="setting-label"><i class="fas fa-globe"></i> <span data-i18n="language">اللغة</span></span>
<div class="select-wrapper"><select class="custom-select" id="languageSelect"><option value="fa">فارسی</option><option value="ar" selected>العربية</option><option value="en">English</option></select></div>
</div>
<div class="setting-item">
<span class="setting-label"><i class="fas fa-moon"></i> <span data-i18n="darkMode">الوضع الليلي</span></span>
<button type="button" class="inner-switch" id="themeSwitchInner" aria-label="Dark mode"></button>
</div>
<div class="setting-item">
<span class="setting-label"><i class="fas fa-text-height"></i> <span data-i18n="fontSize">حجم الخط</span></span>
<div class="font-size-control"><button type="button" class="font-size-btn" id="decreaseFont" aria-label="−">−</button><span class="font-size-value" id="fontSizeValue">1.5</span><button type="button" class="font-size-btn" id="increaseFont" aria-label="+">+</button></div>
</div>
<div class="setting-item">
<span class="setting-label"><i class="fas fa-font"></i> <span data-i18n="font">الخط</span></span>
<div class="select-wrapper"><select class="custom-select" id="fontSelect"><option value="Uthman">عثمان طه</option><option value="Lotus">لوتوس</option><option value="Compset">كومبست</option></select></div>
</div>
<div class="setting-item" id="installButtonContainer" style="display: none;">
<span class="setting-label"><i class="fas fa-download"></i> <span data-i18n="installApp">تثبيت التطبيق</span></span>
<button class="install-btn" id="installBtn"><i class="fas fa-arrow-down"></i> <span data-i18n="install">تثبيت</span></button>
</div>
</div>

function getCountsKey(category) { return `adhkar_counts_${category}`; }
function getTimestampKey(category) { return `adhkar_timestamp_${category}`; }

function loadCounts(category, defaultCounts) {
const stored = localStorage.getItem(getCountsKey(category));
const timestamp = localStorage.getItem(getTimestampKey(category));
const now = Date.now();
if (timestamp) {
const elapsed = now - parseInt(timestamp);
if (elapsed >= RESET_INTERVAL) {
localStorage.setItem(getTimestampKey(category), now.toString());
localStorage.setItem(getCountsKey(category), JSON.stringify(defaultCounts));
return [...defaultCounts];
}
}
if (stored) {
try {
const arr = JSON.parse(stored);
if (Array.isArray(arr) && arr.length === defaultCounts.length) return arr;
} catch(e) {}
}
if (!timestamp) {
localStorage.setItem(getTimestampKey(category), now.toString());
}
return [...defaultCounts];
}

function saveCounts(category, counts) {
localStorage.setItem(getCountsKey(category), JSON.stringify(counts));
localStorage.setItem(getTimestampKey(category), Date.now().toString());
}

function showCategory(cat, pushState=true) {

return;

return;
}
resetPlayer('morning'); resetPlayer('evening');
detailPageTitle.textContent = translations[currentLanguage][cat] || cat;
detailPageTitle.dataset.category = cat;
detailHeader.classList.add('active');
const items = azkarData[cat];
const defaultCounts = items.map(item => item.repeat);
let remainingCounts = loadCounts(cat, defaultCounts);
let html = '';
items.forEach((item, idx) => {
let text = item.text;
if(cat === 'sleep') {
text = text.replace('دستان خود را جمع کنید و در آن بدمید و این سوره ها را بخوانید:', translations[currentLanguage].sleepStep1);
text = text.replace('بعدا دستان خود را مسح کنید بر جسد خویش تا آنجاییکه توان دارید از سر و صورت خویش آغاز نمایید.(این کار را سه مرتبه تکرار نمایید)', translations[currentLanguage].sleepStep2);
text = text.replace('سوره {الم سجدةِ} و {مُلك} را بخوانید', translations[currentLanguage].sleepSurah);
}
const remaining = remainingCounts[idx];
const completed = remaining === 0;
const badgeHtml = completed
? `<span class="completed-badge"><i class="fas fa-check-circle"></i> ${translations[currentLanguage].completed}</span>`
: `<button type="button" class="repeat-badge" data-idx="${idx}"><i class="fas fa-repeat"></i> ${remaining} ${translations[currentLanguage].remaining}</button>`;
html += `<div class="dhikr-card" data-idx="${idx}">
<div class="dhikr-text">${text}</div>
<div class="dhikr-meta">
<span class="reference"><i class="fas fa-book-open"></i> ${item.reference || translations[currentLanguage].source}</span>
${badgeHtml}
</div>
</div>`;
});
detailList.innerHTML = html;
document.querySelectorAll('.repeat-badge').forEach(badge => {
badge.addEventListener('click', (e) => {
e.stopPropagation();
const idx = parseInt(badge.dataset.idx);
if (remainingCounts[idx] > 0) {
remainingCounts[idx]--;
saveCounts(cat, remainingCounts);
const card = badge.closest('.dhikr-card');
const metaDiv = card.querySelector('.dhikr-meta');
const newRemaining = remainingCounts[idx];
if (newRemaining === 0) {
const completedHtml = `<span class="completed-badge"><i class="fas fa-check-circle"></i> ${translations[currentLanguage].completed}</span>`;
const referenceSpan = metaDiv.querySelector('.reference');
metaDiv.innerHTML = (referenceSpan ? referenceSpan.outerHTML : '') + completedHtml;
const completedBadge = metaDiv.querySelector('.completed-badge');
if (completedBadge) {
completedBadge.style.transform = 'scale(1.2)';
setTimeout(() => { if(completedBadge) completedBadge.style.transform = ''; }, 200);
}
} else {
badge.innerHTML = `<i class="fas fa-repeat"></i> ${newRemaining} ${translations[currentLanguage].remaining}`;
badge.style.transform = 'scale(1.1)';
setTimeout(() => { badge.style.transform = ''; }, 150);
}
}
});
});
mainMenu.style.display = 'none'; detailView.style.display = 'flex'; audioDetailView.style.display = 'none';
footer.classList.add('hidden');
if(pushState) history.pushState({ page: 'detail', category: cat }, '', '#'+cat);
}

async function loadAzkar() {
try {
const r = await fetch(JSON_URL);
if(!r.ok) throw new Error();
azkarData = await r.json();
}
catch(e) {
showModal('خطا', 'امکان بارگیری اذکار وجود ندارد. لطفا اتصال اینترنت را بررسی کنید.', 'error');
}
}

let downloadCanceled = false;
async function downloadAudioFilesWithProgress() {
downloadCanceled = false;
progressFill.style.width = '0%';
progressPercent.textContent = '0%';
progressDetail.textContent = `0 / ${AUDIO_URLS.length} ملف`;
progressTitle.textContent = translations[currentLanguage].downloadAudio || 'جاري التحميل...';
progressModal.classList.add('show');
const cache = await caches.open('azkar-audio-v1');
let completed = 0;
for (let i = 0; i < AUDIO_URLS.length; i++) {
if (downloadCanceled) break;
const url = AUDIO_URLS[i];
try {
const response = await fetch(url);
if (response.ok) {
await cache.put(url, response);
completed++;
}
} catch (e) { console.warn('Download failed', url); }
const percent = Math.floor((completed / AUDIO_URLS.length) * 100);
progressFill.style.width = percent + '%';
progressPercent.textContent = percent + '%';
progressDetail.textContent = `${completed} / ${AUDIO_URLS.length} ملف`;
}
progressModal.classList.remove('show');
if (downloadCanceled) return;
if (completed === AUDIO_URLS.length) {
localStorage.setItem('audioCached', 'true');
if (downloadAudioBtn) downloadAudioBtn.style.display = 'none';
showModal(translations[currentLanguage].downloadSuccess, translations[currentLanguage].downloadSuccess, 'success');
} else {
showModal(translations[currentLanguage].downloadFailed, translations[currentLanguage].downloadFailed, 'error');
}
}

function detectSystemLanguage() {
const browserLang = navigator.language || navigator.userLanguage;
if (browserLang.startsWith('fa')) return 'fa';
if (browserLang.startsWith('ar')) return 'ar';
return 'en';
}

function initSettings() {
let darkMode = localStorage.getItem('darkMode');
if (darkMode === null) {
const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
darkMode = systemDark ? 'dark' : 'light';
localStorage.setItem('darkMode', darkMode);
}
if (darkMode === 'dark') {
document.body.classList.add('dark');
themeSwitchInner.classList.add('active');
} else {
document.body.classList.remove('dark');
themeSwitchInner.classList.remove('active');
}
let savedFontSize = localStorage.getItem('fontSize');
if (savedFontSize === null) {
savedFontSize = '1.5';
localStorage.setItem('fontSize', '1.5');
}
applyFontSize(parseFloat(savedFontSize));
let savedFont = localStorage.getItem('fontFamily');
if (savedFont === null) {
savedFont = 'Uthman';
localStorage.setItem('fontFamily', 'Uthman');
}
fontSelect.value = savedFont;
applyFontFamily(savedFont);
if (localStorage.getItem('audioCached') === 'true' && downloadAudioBtn) {
downloadAudioBtn.style.display = 'none';
}
}

function showLanguageSelectionModal() {
// اگر زبان قبلاً ذخیره شده باشد، مودال نمایش داده نشود
if (localStorage.getItem('language')) return false;
// تنظیم عنوان و پیام به زبان سیستم (برای مودال اولیه از انگلیسی یا عربی استفاده می‌کنیم)
const sysLang = detectSystemLanguage();
languageModalTitle.textContent = translations[sysLang].selectLanguage;
languageModalMessage.textContent = translations[sysLang].selectLanguageMsg;
languageModal.classList.add('show');
return true;
}

// رویدادهای انتخاب زبان
document.querySelectorAll('.lang-btn').forEach(btn => {
btn.addEventListener('click', () => {
const lang = btn.dataset.lang;
setLanguage(lang);
languageModal.classList.remove('show');
// پس از انتخاب زبان، بارگذاری کامل برنامه را ادامه می‌دهیم
loadAzkar().then(() => {
showMainMenu();
}).catch(() => {
showMainMenu();
});
});
});

// شروع برنامه: ابتدا تنظیمات اولیه را بار می‌کنیم ولی زبان را اگر ذخیره نشده باشد تنظیم نمی‌کنیم
initSettings();
// بررسی نیاز به نمایش مودال انتخاب زبان
const languageAlreadySet = localStorage.getItem('language') !== null;
if (!languageAlreadySet) {
// نمایش مودال انتخاب زبان
showLanguageSelectionModal();
} else {
// زبان از قبل وجود دارد، آن را تنظیم کرده و برنامه را بارگذاری می‌کنیم
currentLanguage = localStorage.getItem('language');
setLanguage(currentLanguage);
loadAzkar().then(() => {
showMainMenu();
}).catch(() => {
showMainMenu();
});
}

// رویدادهای دیگر (تنظیمات، پخش صوتی و ...) بعد از بارگذاری برنامه اضافه می‌شوند
settingsIcon.onclick = (e) => { e.stopPropagation(); settingsPanel.classList.toggle('show'); };
document.addEventListener('click', (e) => { if(!settingsPanel.contains(e.target) && !settingsIcon.contains(e.target)) settingsPanel.classList.remove('show'); });
themeSwitchInner.onclick = () => {
document.body.classList.toggle('dark');
themeSwitchInner.classList.toggle('active');
localStorage.setItem('darkMode', document.body.classList.contains('dark')?'dark':'light');
};
decreaseFont.onclick = () => { let s = Math.max(1.0, (parseFloat(fontSizeValue.textContent)||1.5)-0.1); applyFontSize(s); localStorage.setItem('fontSize', s.toFixed(1)); };
increaseFont.onclick = () => { let s = Math.min(2.2, (parseFloat(fontSizeValue.textContent)||1.5)+0.1); applyFontSize(s); localStorage.setItem('fontSize', s.toFixed(1)); };
fontSelect.onchange = (e) => { applyFontFamily(e.target.value); localStorage.setItem('fontFamily', e.target.value); };
languageSelect.onchange = (e) => setLanguage(e.target.value);
backBtn.onclick = () => history.back();
window.onpopstate = (e) => { if(e.state && e.state.page==='detail') showCategory(e.state.category, false); else showMainMenu(); };
document.querySelectorAll('.menu-card').forEach(c => c.addEventListener('click', () => showCategory(c.dataset.category, true)));

playBtns.forEach(btn => btn.addEventListener('click', () => {
const id = btn.dataset.id; const audio = id==='morning'?audioMorning:audioEvening; const icon = btn.querySelector('i');
if(isPlaying[id]) { audio.pause(); icon.className = 'fas fa-play'; clearInterval(progressIntervals[id]); isPlaying[id]=false; }
else { if(id==='morning' && isPlaying.evening) resetPlayer('evening'); if(id==='evening' && isPlaying.morning) resetPlayer('morning'); audio.play().catch(e=>console.log); icon.className='fas fa-pause'; progressIntervals[id]=setInterval(()=>updateProgress(id),100); isPlaying[id]=true; }
}));
audioMorning.addEventListener('loadedmetadata',()=>durationTimes.morning.textContent=formatTime(audioMorning.duration));
audioEvening.addEventListener('loadedmetadata',()=>durationTimes.evening.textContent=formatTime(audioEvening.duration));
audioMorning.addEventListener('ended',()=>resetPlayer('morning'));
audioEvening.addEventListener('ended',()=>resetPlayer('evening'));
progressBars.forEach(bar => bar.addEventListener('click', (e) => {
const id = bar.dataset.progress; const audio = id==='morning'?audioMorning:audioEvening; if(audio.duration) { const rect=bar.getBoundingClientRect(); const percent=(e.clientX-rect.left)/rect.width; audio.currentTime=percent*audio.duration; updateProgress(id); }
}));
if (downloadAudioBtn) {
downloadAudioBtn.addEventListener('click', () => {
showConfirmModal(translations[currentLanguage].confirmDownloadTitle, translations[currentLanguage].confirmDownloadMsg, downloadAudioFilesWithProgress);
});
}
if (cancelDownloadBtn) {
cancelDownloadBtn.addEventListener('click', () => {
downloadCanceled = true;
progressModal.classList.remove('show');
});
}

window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt=e; if(!localStorage.getItem('appInstalled') && !window.matchMedia('(display-mode: standalone)').matches) installContainer.style.display='flex'; });
installBtn.onclick = async () => { if(!deferredPrompt) return; deferredPrompt.prompt(); const {outcome}=await deferredPrompt.userChoice; if(outcome==='accepted') { localStorage.setItem('appInstalled','true'); installContainer.style.display='none'; } deferredPrompt=null; };
if(localStorage.getItem('appInstalled') || window.matchMedia('(display-mode: standalone)').matches) installContainer.style.display='none';
window.addEventListener('appinstalled', () => { localStorage.setItem('appInstalled','true'); installContainer.style.display='none'; });

document.querySelectorAll('.menu-card').forEach(c => c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); c.click(); } }));
new MutationObserver(() => document.getElementById('themeColor').content = document.body.classList.contains('dark') ? '#061a1c' : '#0e4a4f').observe(document.body, { attributes: true, attributeFilter: ['class'] });

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e=>console.log);
</script>
</body>
</html>
